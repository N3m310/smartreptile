# nginx front door for the SmartReptile demo stack.
#
# One web surface: the TERRAGUARD React client (ADR-019, task 4.19). Until 2026-10-07 this file kept two apart --
# `/` for the prototype build and `/legacy/` for the M1 static dashboard, which was the fix for BUG-03 (task
# 4.12). The dashboard is retired: every screen it had (sign-in, password recovery, change password, live cards,
# wallboard, health diagnosis) is a React route now, so the promotion is what made the second mount unnecessary.
#
# The SPA fallback is still load-bearing, and it is the half of BUG-03 that stays true: `/` used to serve a Vite
# *dev* entry (`<script type="module" src="/src/main.tsx">`) as a blank page, and `/wallboard.html` was a 404. A
# BrowserRouter client needs an unknown path answered with index.html, because the path is a route rather than a
# file -- without this, a reload on `/wallboard` or any deep route is a 404.

server {
    listen 80;
    server_name _;
    index index.html;

    # The React build (mounted at /srv/app). An unknown path is a client route, not a missing file.
    location / {
        root /srv/app;
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed asset names, so a changed build is a changed URL and the cache can be eternal.
    location /assets/ {
        root /srv/app;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The entry page names the hashed bundle; serving it stale would point at assets that no longer exist.
    location = /index.html {
        root /srv/app;
        add_header Cache-Control "no-cache";
    }
}
