# nginx front door for the SmartReptile demo stack (ADR-017, task 4.12).
#
# Two web surfaces live in web/ and this file is what keeps them apart:
#   /        -> the TERRAGUARD prototype build      (mounted at /srv/prototype)
#   /legacy/ -> the M1 static dashboard              (mounted at /srv/legacy), the surface with the real API behind it
#
# Before 4.12 the `web` service mounted all of web/, so / served the prototype's Vite dev entry
# (<script type="module" src="/src/main.tsx">) as a blank page and /wallboard.html was a 404
# (BUG-03). The compose mounts now mirror this layout exactly.
#
# The two mounts are siblings under /srv, not one nested inside the other: a nested bind mount needs
# its mountpoint created inside the parent mount, and that fails when the parent is read-only
# ("mkdirat ... read-only file system") — while mounting the parent read-write would have created
# web/dist/legacy/ in the working tree.

server {
    listen 80;
    server_name _;
    index index.html;

    # --- TERRAGUARD prototype build -------------------------------------------------
    # A BrowserRouter SPA: an unknown path is a client route, not a missing file. Without this
    # fallback a reload on /dashboard answers 404.
    location / {
        root /srv/prototype;
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed asset names, so a changed build is a changed URL.
    location /assets/ {
        root /srv/prototype;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The entry page names the hashed bundle; serving it stale would point at assets that no longer exist.
    location = /index.html {
        root /srv/prototype;
        add_header Cache-Control "no-cache";
    }

    # --- M1 static dashboard --------------------------------------------------------
    # Plain files with relative asset paths, so `root /srv` maps /legacy/x to /srv/legacy/x.
    # No SPA fallback here: a missing page must stay a 404 instead of silently returning the
    # prototype's entry page.
    location /legacy/ {
        root /srv;
    }
}
