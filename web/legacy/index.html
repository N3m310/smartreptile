<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Injected at container start so the same static files work on localhost and on the demo host. -->
    <meta name="api-base" content="http://localhost:8080" />
    <title>SmartReptile · Live</title>
    <link rel="stylesheet" href="css/app.css?v=0.1.2" />
  </head>
  <body>
    <header class="page">
      <h1>SmartReptile</h1>
      <span class="muted">API: <span id="api-base-label">—</span></span>
    </header>

    <nav class="tabs">
      <a href="index.html" aria-current="page">Live</a>
      <a href="wallboard.html">Wallboard</a>
      <a href="health.html">Health</a>
    </nav>

    <div id="banner" class="banner warn" hidden></div>

    <!-- Shown until a session exists: every terrarium route is authenticated, so there is nothing to poll before
         signing in. Two forms share the panel — sign in, and recover a forgotten password, either with the backup
         code issued at registration or with a single-use code the server issues on request. Labels are filled from
         js/i18n.js, keeping the page bilingual like the rest. -->
    <section id="auth" class="card" hidden>
      <form id="sign-in" class="auth-form">
        <p id="auth-prompt" class="muted"></p>
        <label for="username" id="auth-username-label" class="muted"></label>
        <input id="username" name="username" autocomplete="username" required />
        <label for="password" id="auth-password-label" class="muted"></label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit" id="sign-in-button"></button>
        <button type="button" id="show-recover" class="secondary"></button>
        <p id="auth-message" class="message"></p>
      </form>

      <form id="recover" class="auth-form" hidden>
        <p id="recover-prompt" class="muted"></p>
        <label for="recover-identifier" id="recover-identifier-label" class="muted"></label>
        <input id="recover-identifier" name="recover-identifier" autocomplete="username" required />
        <label for="recover-code" id="recover-code-label" class="muted"></label>
        <input id="recover-code" name="recover-code" autocomplete="one-time-code" spellcheck="false" required />
        <p id="recover-hint" class="muted"></p>
        <label for="recover-password" id="recover-password-label" class="muted"></label>
        <input id="recover-password" name="recover-password" type="password" autocomplete="new-password" required />
        <button type="submit" id="recover-button"></button>
        <button type="button" id="send-reset-code" class="secondary"></button>
        <button type="button" id="show-sign-in" class="secondary"></button>
        <p id="recover-message" class="message"></p>
        <p id="recover-result" class="code" hidden></p>
      </form>
    </section>

    <p id="controls">
      <label for="terrarium" class="muted">Terrarium</label>
      <select id="terrarium"></select>
      <span id="device-header" class="muted"></span>
      <button type="button" id="sign-out" hidden></button>
    </p>

    <main id="cards" class="grid"></main>

    <script type="module" src="js/pages/live.js?v=0.1.5"></script>
  </body>
</html>
