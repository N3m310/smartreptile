<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="api-base" content="http://localhost:8080" />
    <title>SmartReptile · Health</title>
    <link rel="stylesheet" href="css/app.css?v=0.1.1" />
  </head>
  <!--
    Health page (W8, M1 version): shows exactly what docs/04-quality/03 §5 drills rely on — readiness of the
    database and the MQTT broker, plus the counter snapshot from /metrics. Honest numbers, no decoration.
  -->
  <body>
    <header class="page">
      <h1>SmartReptile · Health</h1>
      <span class="muted">API: <span id="api-base-label">—</span></span>
    </header>

    <nav class="tabs">
      <a href="index.html">Live</a>
      <a href="wallboard.html">Wallboard</a>
      <a href="health.html" aria-current="page">Health</a>
    </nav>

    <h2>Readiness</h2>
    <pre id="ready" class="card">loading…</pre>

    <h2>Counters</h2>
    <pre id="metrics" class="card">loading…</pre>

    <script type="module">
      import { apiBase, failureKind, getJson } from './js/api.js?v=0.1.2';

      // The other two pages get this from js/pages/live.js; this page had its own script and never set it, so the
      // header showed a bare em dash and you could not tell which API the numbers came from.
      document.getElementById('api-base-label').textContent = apiBase;

      const ready = document.getElementById('ready');
      const metrics = document.getElementById('metrics');

      async function load() {
        try {
          ready.textContent = JSON.stringify(await getJson('/health/ready'), null, 2);
        } catch (error) {
          // "unreachable" is a diagnosis, so it has to be the right one: a 404 means this server answered and
          // simply has no such endpoint (failureKind is the single classification, shared with the Live page).
          ready.textContent = `${failureKind(error)}: ${error.code}`;
        }

        try {
          metrics.textContent = JSON.stringify(await getJson('/metrics'), null, 2);
        } catch (error) {
          metrics.textContent = `${failureKind(error)}: ${error.code}`;
        }
      }

      load();
      setInterval(load, 15000);
    </script>
  </body>
</html>
