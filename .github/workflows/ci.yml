name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  # The E2E job needs an Android emulator and a SQL Server container, so it does not run on every push; see the
  # `app-e2e` job below and docs/04-quality/05-e2e-ai-testing-plan.md §5 P5.
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * *" # 02:00 Asia/Ho_Chi_Minh

# One pipeline, six gates (§03-implementation/01 §1, §04-quality/01 §7):
#   backend     — build, formatting, unit tests, vulnerable packages
#   integration — real SQL Server: migrations, seeding, SQL-level invariants, /health/ready
#   web         — typecheck, locale-key parity (TC-I-15), production build
#   app         — analyze + widget/unit tests
#   app-e2e     — the four `integration_test` suites on an emulator against the compose stack. Nightly and on
#                 demand, not on every push: it boots an emulator and SQL Server, and `app` already covers the UI
#   firmware    — host unit tests (native env) + ESP32 build
#   secret-scan — the scan that keeps .env out of the repository (NFR-04)
#
# Action versions are chosen so every action runs on the Node 24 runtime: checkout v5, setup-dotnet v5,
# setup-python v6. The previous majors run on Node 20, which the runner now force-upgrades and annotates on every
# run (https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/). Do not
# "simplify" these back to the older majors without checking `runs.using` in each action's action.yml.

jobs:
  backend:
    name: Backend (build, format, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SmartReptile.sln

      - name: Build (warnings are errors)
        run: dotnet build SmartReptile.sln --configuration Release --no-restore

      - name: Formatting gate
        run: dotnet format SmartReptile.sln --verify-no-changes --severity error --no-restore

      - name: Unit tests
        run: dotnet test SmartReptile.sln --configuration Release --no-build --verbosity normal

      - name: Vulnerable packages
        run: dotnet list SmartReptile.sln package --vulnerable --include-transitive

  integration:
    name: Integration (real SQL Server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # The password never appears in this file: it is a repository secret, and the container it protects exists
    # only for the duration of the job. (A literal value here would also be a candidate for the secret-scan job,
    # which would be an entertaining way to fail the pipeline we just fixed.)
    env:
      ConnectionStrings__Default: "Server=127.0.0.1,1433;Database=SmartReptile;User Id=sa;Password=${{ secrets.CI_SQL_PASSWORD }};TrustServerCertificate=True;Encrypt=False"
      MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_PASSWORD }}

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 18
          --health-start-period 40s

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SmartReptile.sln

      - name: Build (warnings are errors)
        run: dotnet build SmartReptile.sln --configuration Release --no-restore

      # The integration project is deliberately outside the solution (see its csproj), so it needs its own restore
      # and its own formatting gate — otherwise "the format gate is clean" would quietly exclude it.
      - name: Restore integration tests
        run: dotnet restore tests/SmartReptile.Tests.Integration/SmartReptile.Tests.Integration.csproj

      - name: Formatting gate (integration tests)
        run: >-
          dotnet format tests/SmartReptile.Tests.Integration/SmartReptile.Tests.Integration.csproj
          --verify-no-changes --severity error --no-restore

      # Applies migrations and seeds through the application's own start-up path, then asserts the schema, the
      # seeded reference data and the invariants that exist only in SQL Server.
      - name: Migrations, seeding and SQL-level invariants
        run: dotnet test tests/SmartReptile.Tests.Integration/SmartReptile.Tests.Integration.csproj --configuration Release --no-restore --verbosity normal

      # The one thing the tests cannot prove on their own: that the application boots against a real database and
      # reports itself ready. This is the path M1 could only verify by hand.
      - name: Boot the API against the real database and require /health/ready to report Healthy
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:8080
          Startup__ApplyMigrationsOnStartup: "true"
          Startup__SeedReferenceDataOnStartup: "true"
        run: |
          set -euo pipefail
          dotnet run --project src/SmartReptile.Api --configuration Release --no-build --no-restore > /tmp/api.log 2>&1 &
          api_pid=$!

          for attempt in $(seq 1 30); do
            if ! kill -0 "$api_pid" 2>/dev/null; then
              echo "::error::the API exited during start-up"
              tail -40 /tmp/api.log
              exit 1
            fi

            if curl -fsS http://127.0.0.1:8080/health/ready -o /tmp/ready.json 2>/dev/null; then
              cat /tmp/ready.json
              grep -Eq '"status": *"Healthy"' /tmp/ready.json
              grep -Eq '"name": *"database"' /tmp/ready.json
              grep -Eq '"name": *"mqtt-broker"' /tmp/ready.json
              grep -qv '"status": *"Unhealthy"' /tmp/ready.json
              echo "ready and healthy on attempt ${attempt}"
              exit 0
            fi

            sleep 2
          done

          echo "::error::/health/ready never reported 200 within 60 s"
          tail -40 /tmp/api.log
          exit 1

  web:
    name: Web client (typecheck, i18n keys, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Dependencies
        run: npm ci

      # `tsc` first: a type error in this client is a screen that renders nothing, and the build would still
      # produce a bundle.
      - name: Type check
        run: npm run typecheck

      # The key-parity half of TC-I-15. Both clients read `app/lib/l10n/app_*.arb`, so this job is what keeps a
      # key that only one locale defines — or a screen naming a key nobody defined — out of a release.
      - name: i18n key parity
        run: npm run check:strings

      - name: Build
        run: npm run build

  app:
    name: Flutter app (analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v5

      # The team develops on Flutter stable; 3.47.x was current when this pipeline was written. The exact
      # local version is recorded in docs/03-implementation/01 §1.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Generate localisations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test --coverage

  app-e2e:
    name: Flutter app (E2E on an emulator)
    # Nightly and on demand only. These four suites need an Android emulator and the compose stack (db + api), so a
    # push-time run would add ~10 minutes to a pipeline that is currently ~5. `app` above still gates every change,
    # and `smoke`+`hermetic` need no backend at all, so nothing that can run cheaply waits for this job.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The emulator needs hardware acceleration; KVM is not enabled for the `ubuntu-latest` user by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Compose requires these two, and generating them here keeps a literal out of the repository — the same rule the
      # `secret-scan` job enforces. The password satisfies SQL Server's policy (upper, lower, digit, symbol).
      - name: Environment for compose
        working-directory: .
        run: |
          {
            echo "MSSQL_SA_PASSWORD=E2e!$(openssl rand -hex 10)A9"
            echo "JWT_SIGNING_KEY=$(openssl rand -hex 32)"
          } > .env

      - name: Start the stack and wait for readiness
        working-directory: .
        run: |
          docker compose up -d --wait
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health/ready; then exit 0; fi
            sleep 5
          done
          echo "the API never reported /health/ready as 200" >&2
          docker compose logs --no-color --tail 200 >&2
          exit 1

      - name: E2E suites
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: |
            set -e
            flutter pub get
            flutter gen-l10n
            mkdir -p ../build/e2e
            flutter test integration_test/e2e_smoke_test.dart \
              -d emulator-5554 --file-reporter json:../build/e2e/smoke.json
            flutter test integration_test/e2e_hermetic_test.dart -d emulator-5554 \
              --dart-define=API_BASE=http://127.0.0.1:18999 \
              --file-reporter json:../build/e2e/hermetic.json
            flutter test integration_test/e2e_fullstack_test.dart -d emulator-5554 \
              --dart-define=API_BASE=http://10.0.2.2:8080 \
              --file-reporter json:../build/e2e/fullstack.json
            flutter test integration_test/e2e_alerts_test.dart -d emulator-5554 \
              --dart-define=API_BASE=http://10.0.2.2:8080 \
              --file-reporter json:../build/e2e/alerts.json

      # The reports are the verdict a person reads (docs/04-quality/05 §11): keep them even when the job passes.
      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: build/e2e/
          retention-days: 14

      - name: Stack logs
        if: failure()
        working-directory: .
        run: docker compose logs --no-color --tail 300

      - name: Tear down
        if: always()
        working-directory: .
        run: docker compose down -v

  firmware:
    name: Firmware (native tests, ESP32 build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install "platformio==6.*"

      # Host build of the pure logic: filters, ring buffer, payload rules. No hardware, no network.
      - name: Native unit tests
        run: pio test -e native

      # Real target build. This is the gate that catches Arduino/ESP32 API mistakes.
      - name: Build for ESP32
        run: pio run -e esp32dev

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # The secret scan walks the whole history, so it needs every commit, not just the tip.
          fetch-depth: 0

      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          version=8.24.3
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          sudo tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm gitleaks.tar.gz
          gitleaks version

      # Scans the whole history rather than using gitleaks-action's `<before>^..<after>` range. On a repository's
      # FIRST push the oldest commit in the range is the root commit, which has no parent, so `<root>^` is an
      # unknown revision: the action aborts with "ERROR: Unexpected exit code [1]" after scanning ~0 bytes —
      # a red pipeline with nothing to find. Measured on run 35595915820, where the other three jobs passed and
      # only this step failed, with `fatal: ambiguous argument '76d984b…^..a2a3a6a…': unknown revision` in the
      # log. The same footgun returns whenever a repository is re-created or an orphan branch is pushed.
      #
      # Full-history scanning is also strictly stronger than per-push diffing: a credential committed and later
      # removed is still found. Cost is negligible here (7 commits, ~900 KB, ~3 s). Verified against this
      # repository before committing to it: "7 commits scanned ... no leaks found", exit 0.
      - name: Scan the full history
        run: gitleaks detect --source . --redact -v

      # Belt and braces: a plain grep for the shapes of secret that this project actually uses.
      - name: Repository must not contain a real .env or certificate
        run: |
          set -e
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked in git. Remove it and rotate every value it contained."
            exit 1
          fi
          if git ls-files | grep -E '\.(pfx|p12|jks|keystore)$'; then
            echo "::error::a signing/certificate file is tracked in git"
            exit 1
          fi
          echo "no committed secrets or certificates"
