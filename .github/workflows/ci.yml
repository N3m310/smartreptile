name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

# One pipeline, four gates (§03-implementation/01 §1, §04-quality/01 §7):
#   backend  — build, formatting, unit tests, vulnerable packages
#   app      — analyze + widget/unit tests
#   firmware — host unit tests (native env) + ESP32 build
#   secrets  — the scan that keeps .env out of the repository (NFR-04)
#
# Action versions are chosen so every action runs on the Node 24 runtime: checkout v5, setup-dotnet v5,
# setup-python v6. The previous majors run on Node 20, which the runner now force-upgrades and annotates on every
# run (https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/). Do not
# "simplify" these back to the older majors without checking `runs.using` in each action's action.yml.

jobs:
  backend:
    name: Backend (build, format, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SmartReptile.sln

      - name: Build (warnings are errors)
        run: dotnet build SmartReptile.sln --configuration Release --no-restore

      - name: Formatting gate
        run: dotnet format SmartReptile.sln --verify-no-changes --severity error --no-restore

      - name: Unit tests
        run: dotnet test SmartReptile.sln --configuration Release --no-build --verbosity normal

      - name: Vulnerable packages
        run: dotnet list SmartReptile.sln package --vulnerable --include-transitive

  app:
    name: Flutter app (analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v5

      # The team develops on Flutter stable; 3.47.x was current when this pipeline was written. The exact
      # local version is recorded in docs/03-implementation/01 §1.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Generate localisations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test --coverage

  firmware:
    name: Firmware (native tests, ESP32 build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install "platformio==6.*"

      # Host build of the pure logic: filters, ring buffer, payload rules. No hardware, no network.
      - name: Native unit tests
        run: pio test -e native

      # Real target build. This is the gate that catches Arduino/ESP32 API mistakes.
      - name: Build for ESP32
        run: pio run -e esp32dev

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          # The secret scan walks the whole history, so it needs every commit, not just the tip.
          fetch-depth: 0

      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          version=8.24.3
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          sudo tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm gitleaks.tar.gz
          gitleaks version

      # Scans the whole history rather than using gitleaks-action's `<before>^..<after>` range. On a repository's
      # FIRST push the oldest commit in the range is the root commit, which has no parent, so `<root>^` is an
      # unknown revision: the action aborts with "ERROR: Unexpected exit code [1]" after scanning ~0 bytes —
      # a red pipeline with nothing to find. Measured on run 35595915820, where the other three jobs passed and
      # only this step failed, with `fatal: ambiguous argument '76d984b…^..a2a3a6a…': unknown revision` in the
      # log. The same footgun returns whenever a repository is re-created or an orphan branch is pushed.
      #
      # Full-history scanning is also strictly stronger than per-push diffing: a credential committed and later
      # removed is still found. Cost is negligible here (7 commits, ~900 KB, ~3 s). Verified against this
      # repository before committing to it: "7 commits scanned ... no leaks found", exit 0.
      - name: Scan the full history
        run: gitleaks detect --source . --redact -v

      # Belt and braces: a plain grep for the shapes of secret that this project actually uses.
      - name: Repository must not contain a real .env or certificate
        run: |
          set -e
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked in git. Remove it and rotate every value it contained."
            exit 1
          fi
          if git ls-files | grep -E '\.(pfx|p12|jks|keystore)$'; then
            echo "::error::a signing/certificate file is tracked in git"
            exit 1
          fi
          echo "no committed secrets or certificates"
