# SmartReptile — local demo stack (§03-implementation/01 §6, ADR-012)
#
# NOTE: there is deliberately NO separate `mqtt` service — the MQTT broker is hosted
# inside the API process (MQTTnet, §03-implementation/01 §1), so topics 1883/8883 are
# published by the `api` service. If the broker is ever extracted to its own container
# (e.g. Mosquitto / HiveMQ), add a `mqtt` service here and point MQTT_HOST at it.

name: smartreptile

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smartreptile-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      # Published on loopback only, never exposed to the network (§02-design/06 §6). The host port is 14330, not
      # 1433, because the aeroponic-iot stack on the same machine already binds 1433 and two course projects must
      # be able to run at once. Inside the Compose network the API still reaches the database on db:1433.
      - "127.0.0.1:14330:1433"
    volumes:
      - db-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: src/SmartReptile.Api/Dockerfile
      args:
        VERSION: ${VERSION:-0.1.0}
    container_name: smartreptile-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      # Built here rather than taken from .env: Docker Compose interpolates variables in THIS file, but it does
      # not expand ${...} inside .env values. A connection string containing a nested ${MSSQL_SA_PASSWORD} in
      # .env would reach the container literally and the SQL login would fail with a confusing error.
      ConnectionStrings__Default: "Server=db,1433;Database=SmartReptile;User Id=sa;Password=${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env};TrustServerCertificate=True;Encrypt=False"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
      Jwt__AccessTokenMinutes: ${JWT_ACCESS_MINUTES:-15}
      Jwt__RefreshTokenDays: ${JWT_REFRESH_DAYS:-30}
      Mqtt__Host: ${MQTT_HOST:-0.0.0.0}
      # Inside a container the plaintext listener has to bind 0.0.0.0 for Docker's port proxy to reach it, so
      # "plaintext is loopback-only" (BR-05.1) is enforced at the published port instead — see the 1883 mapping.
      Mqtt__PlaintextHost: ${MQTT_PLAINTEXT_HOST:-0.0.0.0}
      Mqtt__Port: ${MQTT_PORT:-1883}
      Mqtt__EnableTls: ${MQTT_ENABLE_TLS:-false}
      Mqtt__TlsPort: ${MQTT_TLS_PORT:-8883}
      Mqtt__DisablePlaintextEndpoint: ${MQTT_DISABLE_PLAINTEXT:-false}
      Mqtt__ServerCertificatePath: ${MQTT_SERVER_CERT_PATH:-}
      Mqtt__ServerCertificatePassword: ${MQTT_SERVER_CERT_PASSWORD:-}
      Mqtt__RequireClientAuthentication: ${MQTT_REQUIRE_CLIENT_AUTH:-true}
      Provisioning__SharedKey: ${PROVISIONING_SHARED_KEY:-}
      Provisioning__ClaimCodeMinutes: ${PROVISIONING_CLAIM_CODE_MINUTES:-15}
      Retention__RawDays: ${RETENTION_RAW_DAYS:-90}
      Retention__RollupMonths: ${RETENTION_ROLLUP_MONTHS:-24}
      # Species-profile pictures (FR-10) land in the `uploads` volume mounted below, so they survive a rebuild.
      # The default already resolves to that path inside the container — this line states it rather than implying it.
      Storage__RootPath: ${STORAGE_ROOT_PATH:-/app/uploads}
      Defaults__TimeZoneId: ${DEFAULT_TIMEZONE:-Asia/Ho_Chi_Minh}
      Ingest__HttpFallbackEnabled: ${INGEST_HTTP_FALLBACK_ENABLED:-true}
      Startup__ApplyMigrationsOnStartup: ${STARTUP_APPLY_MIGRATIONS:-true}
      Startup__SeedReferenceDataOnStartup: ${STARTUP_SEED_REFERENCE_DATA:-true}
      # The system administrator (FR-10) — the one account allowed to author the species-profile catalogue, since
      # registration only ever produces an Owner. Empty by default: a deployment with no administrator simply
      # cannot author the catalogue, and reads and per-terrarium overrides are unaffected.
      Admin__Username: ${ADMIN_USERNAME:-}
      Admin__Email: ${ADMIN_EMAIL:-}
      Admin__Password: ${ADMIN_PASSWORD:-}
      # Notification delivery (FR-13, roadmap 3.5). The SMTP channel points at the Mailpit sink below, which is the
      # local inbound server TC-I-12 asserts against and what makes the 120-minute escalation step of §02-design/05
      # §6 demonstrable without a mail account. FCM stays off unless a service-account file is mounted read-only
      # into /secrets (the demo falls back to the inbox, which is the documented answer when push is flaky).
      Notifications__SweepSeconds: ${NOTIFICATIONS_SWEEP_SECONDS:-15}
      Notifications__Smtp__Enabled: ${EMAIL_ENABLED:-false}
      Notifications__Smtp__Host: ${SMTP_HOST:-mailpit}
      Notifications__Smtp__Port: ${SMTP_PORT:-1025}
      Notifications__Smtp__UseStartTls: ${SMTP_USE_STARTTLS:-false}
      Notifications__Smtp__Username: ${SMTP_USERNAME:-}
      Notifications__Smtp__Password: ${SMTP_PASSWORD:-}
      Notifications__Smtp__FromAddress: ${FROM_EMAIL:-no-reply@smartreptile.local}
      Notifications__Smtp__FromName: ${FROM_NAME:-SmartReptile}
      Notifications__Fcm__Enabled: ${FCM_ENABLED:-false}
      Notifications__Fcm__ServiceAccountJsonPath: ${FCM_SERVICE_ACCOUNT_PATH:-}
      # The dashboard is a static page and the API is another origin, so the browser preflights every call.
      # Both spellings are listed on purpose: a browser at http://127.0.0.1:8081 sends
      # `Origin: http://127.0.0.1:8081`, which does NOT match http://localhost:8081. With only the localhost
      # entries the API logs "CORS policy execution failed" and answers 200 with no Access-Control-Allow-Origin
      # header, so the browser discards the response and the dashboard looks broken while the server looks fine.
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_0:-http://localhost:8081}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_1:-http://localhost:8080}
      Cors__AllowedOrigins__2: ${CORS_ORIGIN_2:-http://127.0.0.1:8081}
      Cors__AllowedOrigins__3: ${CORS_ORIGIN_3:-http://127.0.0.1:8080}
      OpenTelemetry__ServiceName: ${OTEL_SERVICE_NAME:-SmartReptile}
      OpenTelemetry__Tracing__SampleRatio: ${OTEL_TRACE_SAMPLE_RATIO:-0.25}
      OpenTelemetry__Otlp__Endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    ports:
      - "8080:8080"          # REST + SignalR
      - "127.0.0.1:1883:1883"  # MQTT plaintext: bound to the host's loopback, never published to the network.
                               # BR-05.1 wants plaintext for local debugging and gone in the release runbook
                               # (MQTT_DISABLE_PLAINTEXT=true); this mapping is what keeps it off the LAN meanwhile.
      - "8883:8883"          # MQTT over TLS — the only port a real device needs
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads      # species-profile pictures (FR-10) + camera snapshots and export files (FR-15/FR-17)
      - ./certs:/certs:ro
      # The FCM service-account file, when a deployment has one. Read-only and never committed (see .gitignore);
      # an empty directory is the normal case and simply leaves the push channel off.
      - ./secrets:/secrets:ro
    restart: unless-stopped

  # The local mail sink (FR-13, roadmap 3.5). Not a mail server for users: nothing is ever delivered onward, which
  # is exactly what makes it safe in a demo and what TC-I-12 means by "a local SMTP sink". The API reaches it as
  # `mailpit:1025` inside the Compose network; the UI is published on the host's loopback only, so a reviewer can
  # see the 120-minute escalation email arrive without opening a port to the network.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: smartreptile-mailpit
    ports:
      - "127.0.0.1:8025:8025"   # the web UI: http://127.0.0.1:8025
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    container_name: smartreptile-web
    ports:
      - "8081:80"
    volumes:
      # One web surface, since the legacy dashboard was retired (ADR-019, task 4.19): the built TERRAGUARD
      # client, which is what web/nginx.conf serves. The build is committed so the demo needs no Node.
      # Mounting all of ./web here is what served the prototype's Vite entry as a blank page in BUG-03.
      - ./web/dist:/srv/app:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data:
  uploads:
