; SmartReptile sensor node — PlatformIO project (§03-implementation/04)
;
; Two environments:
;   esp32dev : the real node (ESP32 DevKitC v4)
;   native   : host build of the pure logic (filters, ring buffer, payload rules) so the
;              reliability-critical code is unit-tested without hardware — see TC-U-FW-*.
;
; Versions are pinned deliberately (NFR-08): "it built last week" is not a reproducible build.

[platformio]
default_envs = esp32dev
src_dir = src
lib_dir = lib
test_dir = test

[env:esp32dev]
; 6.13.0 is the version that `espressif32@^6.8.0` resolves to, verified against the registry on 2026-09-21.
; Note: 6.9.0 does not exist — do not "fix" this to that value.
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = default.csv

build_flags =
    -Iinclude                 ; our headers first: a framework config.h must not shadow sr_config.h
    -DSR_FW_VERSION=\"0.1.0\"
    -DSR_LOG_LEVEL=2          ; 0 off, 1 error, 2 info, 3 debug
    -DSR_BENCH_MODE=0         ; 1 = fake sensors for bench/demo use (never released)
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    knolleary/PubSubClient@^2.8.0
    bblanchon/ArduinoJson@^7.2.0
    adafruit/Adafruit SHT31 Library@^2.2.2
    claws/BH1750@^1.3.0
    adafruit/Adafruit LTR390 Library@^1.0.4
    milesburton/DallasTemperature@^3.11.0
    paulstoffregen/OneWire@^2.3.8
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    tzapu/WiFiManager@^2.0.17

[env:native]
platform = native
test_framework = unity
build_flags =
    -Iinclude
    -DSR_FW_VERSION=\"0.1.0-native\"
    -DSR_BENCH_MODE=1
    -std=gnu++17
